<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en Brailletopía para acceder a tu perfil y continuar aprendiendo.">
  <title>Iniciar Sesión - Brailletopía</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  
  <style>
    .login-container {
      max-width: 500px;
      margin: var(--space-xxxl) auto;
      padding: var(--space-xl);
    }
    
    .login-card {
      background: var(--color-white);
      border: var(--border-width-thick) solid var(--color-primary);
      border-radius: var(--border-radius-md);
      padding: var(--space-xxl);
      box-shadow: var(--shadow-lg);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    
    .login-header h1 {
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }
    
    .login-divider {
      margin: var(--space-lg) 0;
      text-align: center;
      position: relative;
    }
    
    .login-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--color-gray-200);
    }
    
    .login-divider span {
      position: relative;
      background: var(--color-white);
      padding: 0 var(--space-md);
      color: var(--color-gray-700);
      font-size: var(--font-size-small);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  
  <!-- Header (cargado dinámicamente) -->
  <div id="header-container"></div>
  
  <!-- Panel de Accesibilidad (cargado dinámicamente) -->
  <div id="accessibility-container"></div>
  
  <main id="main-content" class="main-content">
    <div class="container">
      <!-- Breadcrumb -->
      <div id="breadcrumb-nav"></div>
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <h1 id="form-title">Iniciar Sesión</h1>
            <p>Accede a tu cuenta para continuar aprendiendo braille</p>
          </div>
          
          <!-- Mensaje de error global -->
          <div id="login-error" role="alert" aria-live="assertive" style="display: none;"></div>
          
          <!-- Formulario de Login -->
          <form id="login-form" novalidate aria-label="Formulario de inicio de sesión">
            <!-- Nombre (solo en registro) -->
            <div class="form-group" id="name-group" style="display: none;">
              <label for="name" class="form-label required">Nombre</label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-input"
                aria-describedby="name-error"
                autocomplete="name"
                placeholder="Tu nombre"
              >
              <div id="name-error" class="form-error" role="alert" style="display: none;"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="email" class="form-label required">Correo electrónico</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input"
                aria-required="true"
                aria-describedby="email-error"
                autocomplete="email"
                placeholder="tu@email.com"
              >
              <div id="email-error" class="form-error" role="alert" style="display: none;"></div>
            </div>
            
            <!-- Password -->
            <div class="form-group">
              <label for="password" class="form-label required">Contraseña</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input"
                aria-required="true"
                aria-describedby="password-error"
                autocomplete="current-password"
                placeholder="••••••••"
              >
              <div id="password-error" class="form-error" role="alert" style="display: none;"></div>
            </div>
            
            <!-- Recordar sesión -->
            <div class="form-group">
              <div class="form-check">
                <input 
                  type="checkbox" 
                  id="remember" 
                  name="remember" 
                  class="form-check-input"
                >
                <label for="remember" class="form-check-label">
                  Recordar mi sesión
                </label>
              </div>
            </div>
            
            <!-- Botón Submit -->
            <button type="submit" id="submit-btn" class="btn btn-primary btn-xl" style="width: 100%;">
              Iniciar Sesión
            </button>
          </form>

          <div class="login-divider">
            <span>o</span>
          </div>

          <!-- Cambiar entre login y registro -->
          <div style="text-align: center;">
            <p id="switch-question" style="margin-bottom: var(--space-md); color: var(--color-gray-700);">
              ¿No tienes cuenta?
            </p>
            <button type="button" id="switch-mode" class="btn btn-outline btn-xl" style="width: 100%;">
              Crear una cuenta
            </button>
          </div>
        </div>
      </div>
      
      <!-- Botón Volver -->
      <div id="back-button-container"></div>
    </div>
  </main>
  
  <!-- Footer (cargado dinámicamente) -->
  <div id="footer-container"></div>
  
  <script type="module" src="../src/pages/login.ts"></script>
</body>
</html>
