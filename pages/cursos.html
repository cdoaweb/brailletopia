<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cursos de braille organizados por niveles - Principiante, Intermedio y Avanzado.">
  <title>Cursos - Brailletopía</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/accessibility.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  
  <!-- Header (cargado dinámicamente) -->
  <div id="header-container"></div>
  
  <!-- Panel de Accesibilidad (cargado dinámicamente) -->
  <div id="accessibility-container"></div>
  
  <main id="main-content" class="main-content">
    <div class="container">
      <!-- Breadcrumb -->
      <div id="breadcrumb-nav"></div>
      
      <div class="section-header">
        <h1 class="section-title">Cursos de Braille</h1>
        <p>Aprende braille paso a paso con nuestros cursos estructurados por niveles de dificultad.</p>
      </div>
      
      <div class="layout-with-sidebar">
        <!-- Sidebar con Filtros -->
        <aside class="sidebar" aria-label="Filtros de cursos">
          <h2 style="margin-bottom: var(--space-md); font-size: var(--font-size-h4);">Filtrar Cursos</h2>
          
          <div class="form-group">
            <label class="form-label" for="filter-level">Nivel</label>
            <select id="filter-level" class="form-select">
              <option value="todos">Todos los niveles</option>
              <option value="principiante">Principiante</option>
              <option value="intermedio">Intermedio</option>
              <option value="avanzado">Avanzado</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="filter-category">Categoría</label>
            <select id="filter-category" class="form-select">
              <option value="todos">Todas las categorías</option>
              <option value="alfabeto">Alfabeto</option>
              <option value="numeros">Números</option>
              <option value="puntuacion">Puntuación</option>
              <option value="escritura">Escritura</option>
            </select>
          </div>
          
          <button id="filter-clear" class="btn btn-outline" style="width: 100%; margin-top: var(--space-sm);" aria-label="Limpiar filtros">
            Limpiar Filtros
          </button>
        </aside>
        
        <!-- Contenido Principal -->
        <div>
          <div id="guest-notice"></div>
          <div id="courses-grid" class="grid" role="list" aria-label="Lista de cursos disponibles"></div>
        </div>
      </div>

      <!-- Visor de lecciones -->
      <section id="lesson-area" aria-live="polite" style="display: none;"></section>
      
      <!-- Botón Volver -->
      <div id="back-button-container"></div>
    </div>
  </main>
  
  <!-- Footer (cargado dinámicamente) -->
  <div id="footer-container"></div>
  
  <script type="module" src="../src/pages/cursos.ts"></script>
</body>
</html>
